(function () {
  var ua = navigator.userAgent || "";

  // 這個警示只在 Android 上判斷。iPhone 上所有 App 的內建瀏覽器都被蘋果
  // 強制要求使用跟 Safari 一樣的 WebKit 引擎，發音功能原則上本來就正常，
  // 而且 iOS 也沒有像 Android intent:// 那種能一鍵跳轉 Safari 的方式，
  // 硬跳出提示反而只是無意義的干擾，所以直接略過。
  var isAndroid = /Android/i.test(ua);
  if (!isAndroid) return;

  // 常見「App 內建瀏覽器」的 User-Agent 特徵字串
  var inAppPatterns = [
    /Line\//i,          // LINE
    /FBAN|FBAV/i,       // Facebook / Messenger
    /Instagram/i,
    /MicroMessenger/i,  // 微信 WeChat
    /\bQQ\//i,
    /Weibo/i,
    /TikTok|musical_ly/i,
  ];
  var isInApp = inAppPatterns.some(function (re) { return re.test(ua); });
  if (!isInApp) return;

  var dismissed = false;
  try { dismissed = sessionStorage.getItem("inapp-warning-dismissed") === "1"; } catch (e) {}
  if (dismissed) return;

  var banner = document.getElementById("inapp-warning");
  banner.style.display = "block";

  document.getElementById("inapp-dismiss-btn").addEventListener("click", function () {
    banner.style.display = "none";
    try { sessionStorage.setItem("inapp-warning-dismissed", "1"); } catch (e) {}
  });

  document.getElementById("inapp-open-browser-btn").addEventListener("click", function () {
    var url = location.href;
    // 嘗試用 intent 網址直接叫 Chrome 開啟這個頁面
    var withoutScheme = url.replace(/^https?:\/\//, "");
    var intentUrl = "intent://" + withoutScheme + "#Intent;scheme=https;package=com.android.chrome;end";
    window.location.href = intentUrl;
    // 保底：如果內建瀏覽器擋掉了 intent 跳轉，1.2 秒後改用開新分頁的方式
    setTimeout(function () {
      window.open(url, "_blank");
    }, 1200);
  });
})();
</script>

/* 的 localStorage，讓進度可以正常儲存在使用者自己的電腦/手機上           */

window.storage = {
  get(key) {
    return new Promise((resolve, reject) => {
      try {
        const raw = localStorage.getItem(key);
        if (raw === null) {
          reject(new Error("not found"));
          return;
        }
        resolve({
          key,
          value: raw,
          shared: false
        });
      } catch (e) {
        reject(e);
      }
    });
  },
  set(key, value) {
    return new Promise((resolve, reject) => {
      try {
        localStorage.setItem(key, value);
        resolve({
          key,
          value,
          shared: false
        });
      } catch (e) {
        reject(e);
      }
    });
  },
  delete(key) {
    return new Promise((resolve, reject) => {
      try {
        localStorage.removeItem(key);
        resolve({
          key,
          deleted: true,
          shared: false
        });
      } catch (e) {
        reject(e);
      }
    });
  },
  list(prefix) {
    return new Promise(resolve => {
      const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
      resolve({
        keys,
        prefix,
        shared: false
      });
    });
  }
